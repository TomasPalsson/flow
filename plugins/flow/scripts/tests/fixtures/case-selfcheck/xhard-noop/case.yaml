schema_version: "1.1"
name: xhard-noop
tags: [pipeline]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "do nothing"
  max_turns: 5
  allowed_tools: [Read, Write]
graders:
  - name: no-zzz
    type: regex
    target: { source: file, path: a.py }
    pattern: "zzz"
    match: not_contains
