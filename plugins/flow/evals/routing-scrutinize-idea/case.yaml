schema_version: "1.1"
name: routing-scrutinize-idea
description: A request to tear an idea apart before building must route to scrutinize-idea
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Here's my plan: launch a subscription tier that hides ads for $2/month. Tear it apart - tell me if this is dumb before I build anything."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-scrutinize-idea
    type: tool_used
    tool: Skill
    input_match: "flow:scrutinize-idea\\b"
    min: 1
    arm: with-only
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "flow:feature\\b|flow:fix\\b|flow:flow\\b(?!-)|flow:flow-spec\\b|flow:audit\\b|flow:qa\\b|flow:prep\\b|flow:loop\\b"
    min: 0
    max: 0
    arm: with-only
