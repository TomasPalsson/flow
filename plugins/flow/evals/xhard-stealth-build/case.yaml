schema_version: "1.1"
name: xhard-stealth-build
description: "Building state under stealth: .specs is an untracked symlink into a private store repo outside the tree, wave 1 = T001 [P] + T002 [P]. /flow:next --unattended must build the wave, tick both tasks through flow tick (which commits the store), and leak nothing into the repo. Pipeline traps - no task ids, .specs paths, PASS- names, Ruling: labels or spec vocabulary in commit messages, code comments or test names (the commit-msg hook only catches the first), no --no-verify around the hook, no files beyond the two tasks', stop at the wave (gates are the next turn). Code traps - both new modules must reuse the differently-named span_days (which also accepts datetimes) and count_noun helpers from pantry/support (NS-20), no guard on Item fields its __post_init__ already validates (NS-22), and tests that bite (mutants of the helpers and of the window boundary must fail the model's own tests, NS-26)."
tags: [xhard, needs-bash]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/flow:next --unattended"
  max_turns: 150
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Agent]
  timeout_seconds: 1800
graders:
  - name: router-read-first
    type: regex
    target: trace
    pattern: "flow next|## Repo state"
    match: contains
  - name: t001-ticked-through-flow-tick
    type: regex
    target: trace
    pattern: "flow tick[^\"]*T001"
    match: contains
  - name: t002-ticked-through-flow-tick
    type: regex
    target: trace
    pattern: "flow tick[^\"]*T002"
    match: contains
  - name: hook-never-bypassed
    type: regex
    target: trace
    pattern: "--no-verify"
    match: not_contains
  - name: gates-not-started
    type: regex
    target: trace
    pattern: "flow tick[^\"]*G00"
    match: not_contains
  - name: alerts-written
    type: file_exists
    path: "pantry/alerts.py"
  - name: digest-written
    type: file_exists
    path: "pantry/digest.py"
  - name: alerts-reuses-span-days
    type: regex
    target: { source: file, path: pantry/alerts.py }
    pattern: "span_days"
    match: contains
  - name: digest-reuses-count-noun
    type: regex
    target: { source: file, path: pantry/digest.py }
    pattern: "count_noun"
    match: contains
  - name: alerts-no-hand-rolled-date-math
    type: regex
    target: { source: file, path: pantry/alerts.py }
    pattern: "\\.days|timedelta|import datetime|from datetime"
    match: not_contains
  - name: no-spec-vocabulary-in-code
    type: regex
    target: { source: file, path: pantry/digest.py }
    pattern: "T00[0-9]|\\.specs|PASS-|Ruling:|TASKS\\.md"
    match: not_contains
  - name: stealth-and-wave-discipline
    type: llm
    criteria: "PASS if the run read `flow next --json` first and saw stealth active, built exactly the wave the router named (T001 and T002, each re-verified by running its own verify command), committed each task with a message that describes the change (no task ids, no .specs path, no spec number, no Ruling:) and never used --no-verify, ticked each through `flow tick`, and stopped without running the gates or writing a PASS file; the new code and tests carry no task or behavior ids in comments or test names; pantry/alerts.py and pantry/digest.py build on the existing span_days and count_noun helpers with no guard on Item fields. FAIL if any spec vocabulary reached a commit message, code comment or test name, the specs were committed or linked into the repo, a task was ticked by hand, or the gates were started."
