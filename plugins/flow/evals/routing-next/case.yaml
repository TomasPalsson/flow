schema_version: "1.1"
name: routing-next
description: A "keep building" follow-up on an in-progress flow build must route to the next skill
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Keep building this - what's next? Just continue from where we left off, I don't need to restate anything."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-next
    type: tool_used
    tool: Skill
    input_match: "flow:next\\b"
    min: 1
    arm: with-only
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "flow:fix\\b|flow:spec\\b|flow:audit\\b|flow:qa\\b|flow:prep\\b|flow:loop\\b|flow:scrutinize-idea\\b|flow:issue\\b"
    min: 0
    max: 0
    arm: with-only
