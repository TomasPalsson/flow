schema_version: "1.1"
name: routing-develop-idea
description: A sliver of an idea with no clear problem or user must route to develop-idea, not straight to a spec or prep
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I've got a half-formed idea for this orders app — something about regulars reordering faster, but I honestly don't know what it is yet or who it's really for. Think it through with me before anything gets written down."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-develop-idea
    type: tool_used
    tool: Skill
    input_match: "flow:develop-idea\\b"
    min: 1
    arm: with-only
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "flow:fix\\b|flow:next\\b|flow:spec\\b|flow-extras:audit\\b|flow:qa\\b|flow:prep\\b|flow:loop\\b|flow-extras:scrutinize-idea\\b|flow:issue\\b"
    min: 0
    max: 0
    arm: with-only
