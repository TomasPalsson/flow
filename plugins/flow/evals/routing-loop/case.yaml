schema_version: "1.1"
name: routing-loop
description: An unattended retry-until-green request must route to the loop skill
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The integration suite is red (`./run-tests.sh`). Keep going until it's green - don't stop until every test passes, I'm heading out for the night."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
timeout_seconds: 900
graders:
  - name: fires-loop
    type: tool_used
    tool: Skill
    input_match: "flow:loop\\b"
    min: 1
    arm: with-only
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "flow:fix\\b|flow:next\\b|flow:spec\\b|flow:audit\\b|flow:qa\\b|flow:prep\\b|flow:scrutinize-idea\\b|flow:issue\\b"
    min: 0
    max: 0
    arm: with-only
