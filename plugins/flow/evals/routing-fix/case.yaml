schema_version: "1.1"
name: routing-fix
description: A plain bug report with no slash command must route to the fix skill, and reproduce before patching
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The login page has been crashing with `TypeError: cannot read properties of undefined (reading 'id')` since Tuesday's deploy. Users can't sign in. Can you sort this out?"
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-fix
    type: tool_used
    tool: Skill
    input_match: "\\bfix\\b"
    min: 1
    arm: with-only
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "\\bfeature\\b|\\bflow\\b(?!-)|\\baudit\\b|\\bqa\\b"
    min: 0
    max: 0
    arm: with-only
  - name: reproduce-first
    type: llm
    criteria: "PASS if the response commits to reproducing the crash (a failing test, a reproduction command, or a request for the exact repro steps) BEFORE proposing any code change, and does not guess at a fix from the error message alone. FAIL if it proposes a patch without first establishing a reproduction."
