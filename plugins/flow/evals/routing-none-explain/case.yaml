schema_version: "1.1"
name: routing-none-explain
description: A plain read-only explanation request must not fire any skill
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Can you explain what the `calculate_total` function in src/cart.py does? I just want to understand the logic, no changes needed."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-skill-fires
    type: tool_used
    tool: Skill
    input_match: ".*"
    min: 0
    max: 0
    arm: with-only
