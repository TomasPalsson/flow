schema_version: "1.1"
name: pipeline-spec-first-turn
description: /flow:spec's one batched discovery turn must state the route and offer every pre-answered position in the same message, not stop and wait one question at a time
tags: [pipeline]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/flow:spec Add a url_path property to Post that returns /posts/<slug of title>"
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: route-and-batched-offer
    type: llm
    criteria: "PASS if the message states the route (bounded, oneshot, or dispatch) with its reason in the same message, and either (a) it has open intent gaps and lists them as pre-answered assumptions each with a confidence, including the negative-scope position and a number for every adjective, ending by asking the user to confirm or correct in one reply, or (b) it has zero intent gaps (a bounded idea this small), so it prints the concrete plan instead (the change, the test that proves it, the one risk) and asks a single 'Go?' without waiting across turns. FAIL if it asks questions one at a time, asks more than one turn's worth, or writes artifacts before the offer or the plan."
  - name: not-stop-and-wait
    type: regex
    pattern: "Reply \"small\", \"medium\", or \"large\""
    match: not_contains
