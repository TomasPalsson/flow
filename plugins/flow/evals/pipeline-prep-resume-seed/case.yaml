schema_version: "1.1"
name: pipeline-prep-resume-seed
description: A bare /flow:prep with a develop-idea seed PREP.md on disk must resume that seed, not ask for a new idea
tags: [pipeline]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/flow:prep"
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: resumes-the-seed
    type: llm
    criteria: "PASS if the message lists the seed's recorded points back to the user (forgetting a habit at the moment it matters; one person tracking 3-5 habits on a phone; no social or sharing features) and asks the user to say what is wrong with them. FAIL if instead it asks a new question about any one of those points, asks the user to describe their idea, or writes a spec."
  - name: does-not-ask-for-the-idea
    type: regex
    pattern: "[Dd]escribe (it|your idea|the idea)|[Ww]hat('s| is) (the|your) idea"
    match: not_contains
  - name: seed-line-survives
    type: regex
    target: { source: file, path: .specs/001-habit-reminders/PREP.md }
    pattern: "Seed: \"some kind of habit thing"
    match: contains
  - name: one-ask-not-one-per-line
    type: regex
    pattern: "[Cc]onfirm or correct\\?[\\s\\S]*[Cc]onfirm or correct\\?"
    match: not_contains
