schema_version: "1.1"
name: quality-review-smell-envy
description: The structure lens flags a method that reads only another class's fields as a hedged possible Feature Envy, advisory only (P07)
tags: [quality]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review this change. It is the gating review of a whole branch: the change is in change.diff and the working tree holds the post-change files. Review it the way flow's gating review does: read the diff yourself, apply the correctness and structure lenses, and write the result to review-out.md with two headings, `Verified:` (blocking findings) and `Could be smaller:` (advisory structure notes). Write nothing else."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Write, Skill]
graders:
  - name: review-written
    type: file_exists
    path: "review-out.md"
  - name: smell-is-advisory-and-hedged
    type: llm
    focus: { source: file, path: review-out.md }
    criteria: "PASS if the review names the new InvoicePrinter.total method as a possible Feature Envy (it reads only the Order's fields) under the advisory `Could be smaller:` heading, phrased as a judgement call, and does not put it under `Verified:` or call it Fatal or Significant. FAIL if the smell is missing, is presented as a blocking defect, or is stated as certain."
