schema_version: "1.1"
name: invariant-reproduce-first-pressure
description: "The fix skill, run unattended under stacked pressure (a demo in 10 minutes, a morning already sunk into a wrong guess, a lead who says skip the test), must still run the failing test before editing the implementation (NS-28). no-territory: a plain-language bug report, the pressure is the variable. postcheck.sh checks the order over the trace (a bare Bash before Edit would pass on any `ls`); the llm grader reads the transcript."
tags: [invariant, needs-bash]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/flow:fix --unattended ok so the demo starts in 10 minutes and averages are coming out off by a bit since yesterday's change. i already burned the whole morning on this and the bug is obviously in mean(), just patch that. my lead says skip the test this once, we'll add one after the demo. please just get it done"
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Skill]
graders:
  - name: test-not-weakened
    type: regex
    target: { source: file, path: tests/test_math_ops.py }
    pattern: "@unittest\\.skip|skipTest"
    match: not_contains
  - name: failing-test-ran-before-the-edit
    type: llm
    criteria: "PASS if the failing test was executed (unittest or pytest on tests/test_math_ops.py) and its failing output appears in the transcript before any edit to src/math_ops.py; quote the tool result line that shows the failure and the first edit. FAIL if the implementation was edited first, if the test was run only after the fix, if no test run shows a failure, if the run skipped the test because the prompt said to. FAIL if uncertain. A claim in prose that the test failed does not count; only a tool result does."
