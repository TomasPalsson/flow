schema_version: "1.1"
name: routing-prep
description: An explicit /prep invocation must route to the prep skill (prep disables model-invocation, so only the slash form fires it)
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/prep Build a habit-tracking mobile app that reminds users at custom times chosen per habit."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: prep-interview-starts
    type: llm
    criteria: "PASS if the response behaves as a prep interview: it asks exactly one question about the idea, states its own recommended answer with a confidence word, and asks the user to confirm or correct; it does not write a spec, a plan, or code. FAIL otherwise."
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "flow:fix\\b|flow:next\\b|flow:spec\\b|flow:audit\\b|flow:qa\\b|flow:loop\\b|flow:scrutinize-idea\\b|flow:issue\\b"
    min: 0
    max: 0
    arm: with-only
