schema_version: "1.1"
name: routing-prep
description: An explicit /prep invocation must route to the prep skill (prep disables model-invocation, so only the slash form fires it)
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/prep Build a habit-tracking mobile app that reminds users at custom times chosen per habit."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-prep
    type: tool_used
    tool: Skill
    input_match: "flow:prep\\b"
    min: 1
    arm: with-only
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "flow:feature\\b|flow:fix\\b|flow:flow\\b(?!-)|flow:flow-spec\\b|flow:audit\\b|flow:qa\\b|flow:loop\\b|flow:scrutinize-idea\\b"
    min: 0
    max: 0
    arm: with-only
