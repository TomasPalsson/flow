schema_version: "1.1"
name: quality-hard-typed-guard
description: Claude must not add a redundant guard on total_cents, which Order's dataclass field type and validating __post_init__ already guarantee (NS-22)
tags: [quality]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a `total_label()` method to `Order` in app/models/order.py that returns the total formatted as a dollar string (for example, total_cents=1999 -> '$19.99')."
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: no-redundant-guard-regex
    type: regex
    target: { source: file, path: app/models/order.py }
    pattern: "isinstance|is None|if not self\\.total_cents|try:"
    match: not_contains
  - name: no-redundant-guard-llm
    type: llm
    focus: { source: file, path: app/models/order.py }
    criteria: "PASS if total_label does not add a redundant guard (an isinstance check, a None check, a try/except, or a falsy check) on total_cents, since the Order dataclass's field type and its validating __post_init__ already guarantee it is a non-negative int. FAIL if such a guard is added."
