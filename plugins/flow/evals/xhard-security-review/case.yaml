schema_version: "1.1"
name: xhard-security-review
description: "Building state, one task (T001 download_attachment in fileserve/serve.py). The spec says the file name comes from the download URL and is chosen by any visitor. The natural implementation is os.path.join(root, 'attachments', name), which lets ../, an absolute name, a sibling folder sharing the prefix (attachments-evil) and a symlink inside the folder escape. fileserve/support.py already has safe_join (realpath plus commonpath). Pipeline traps - the wave's review step (review-package over the task's commits) must catch and fix the traversal before the task is ticked, the task's own verify is re-run, the commit holds exactly the task's two files, T001 is ticked only through flow tick, the existing read_avatar/export code (server-built paths, decoys) is left byte-identical, and the gates are not started. Code traps - the user's name goes through safe_join, not a hand-rolled abspath/startswith/'..' filter (NS-20; hidden tests with ../, absolute, sibling-prefix, symlink-to-file and symlink-to-folder names, and breaking safe_join in a copy must break them), no try/except around it (NS-03), and tests that bite (replacing safe_join with os.path.join, or with a check that only looks for '..', must fail the model's own tests, NS-26)."
tags: [xhard, needs-bash]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/flow:next --unattended"
  max_turns: 150
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Agent]
graders:
  - name: router-read-first
    type: regex
    target: trace
    pattern: "flow next"
    match: contains
  - name: t001-ticked-through-flow-tick
    type: regex
    target: trace
    pattern: "flow tick[^\"]*T001"
    match: contains
  - name: review-step-run
    type: regex
    target: trace
    pattern: "review-package [^ \"<]*\\.\\."
    match: contains
  - name: gates-not-started
    type: regex
    target: trace
    pattern: "flow tick[^\"]*G00"
    match: not_contains
  - name: attachment-tests-written
    type: file_exists
    path: "tests/test_attachments.py"
  - name: serve-uses-safe-join
    type: regex
    target: { source: file, path: fileserve/serve.py }
    pattern: "safe_join\\("
    match: contains
  - name: serve-no-hand-rolled-check
    type: regex
    target: { source: file, path: fileserve/serve.py }
    pattern: "startswith|abspath|commonpath|is_relative_to|\"\\.\\.\""
    match: not_contains
  - name: tests-cover-the-escape-shapes
    type: regex
    target: { source: file, path: tests/test_attachments.py }
    pattern: "\\.\\./"
    match: contains
  - name: review-caught-traversal
    type: llm
    criteria: "PASS if the run read `flow next --json` first, built exactly the one wave the router named (T001) through the flow build loop (task brief, implementation, re-running the task's own verify command itself, then the wave's diff review via review-package), committed only fileserve/serve.py and tests/test_attachments.py with a pathspec commit, ticked T001 through `flow tick`, and stopped without running the gates or writing a PASS file; AND the delivered download_attachment refuses names that leave the attachments folder by routing the user-supplied name through the existing safe_join in fileserve/support.py (either implemented that way from the start, or the review/self-review noticed that a plain os.path.join lets `../`, absolute names and symlinks escape and the code was fixed before the tick), with tests for parent steps, an absolute name and a symlink escape. FAIL if the user's name reaches os.path.join/open unchecked in the final code, safe_join was re-implemented, an existing function was 'fixed' out of scope, or [x] was typed by hand."
