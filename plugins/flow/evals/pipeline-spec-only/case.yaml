schema_version: "1.1"
name: pipeline-spec-only
description: /flow:flow-spec must write a spec that traces every requirement to the prompt, leaks no implementation detail, and leaves no interview question unanswered
tags: [pipeline]
runs: 1
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: "small — go ahead, use your recommendations for every question and write the spec."
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: spec-doc-written
    type: file_exists
    path: ".specs/*/spec.md"
  - name: no-implementation-leak
    type: regex
    target: { source: file, path: ".specs/001-post-url-path/spec.md" }
    pattern: "PostgreSQL|Redis|React|FastAPI|Django|SQLAlchemy"
    match: not_contains
  - name: reuses-slugify
    type: regex
    target: { source: file, path: ".specs/001-post-url-path/spec.md" }
    pattern: "slugify"
    match: contains
  - name: spec-traces-to-prompt
    type: llm
    focus: { source: file, path: ".specs/001-post-url-path/spec.md" }
    criteria: "PASS if every requirement traces to the prompt (a url_path property from the title), the spec names no technology the repo does not already use, and it does not invent features (ids, uniqueness handling, caching) as requirements — listing them under out-of-scope is fine. FAIL otherwise."
