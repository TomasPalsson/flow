schema_version: "1.1"
name: invariant-reproduce-first
description: Fixing a bug must run the failing test (Bash) before editing the implementation (NS-28)
tags: [invariant, needs-bash]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The test in tests/test_math_ops.py is failing. Please fix `average` in src/math_ops.py so it passes."
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Bash, Edit]
graders:
  - name: reproduces-before-editing
    type: tool_order
    before: Bash
    after: Edit
