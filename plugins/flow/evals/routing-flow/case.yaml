schema_version: "1.1"
name: routing-flow
description: An idea-to-PR request that wants to walk away must route to the flow skill
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Let's build a CSV export feature for this app end to end - spec it, build it, and open a verified PR. I want to walk away and have this shipped without stopping me for anything you can decide yourself."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-flow
    type: tool_used
    tool: Skill
    input_match: "\\bflow\\b(?!-)"
    min: 1
    arm: with-only
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "\\bfix\\b|\\baudit\\b|flow-spec"
    min: 0
    max: 0
    arm: with-only
