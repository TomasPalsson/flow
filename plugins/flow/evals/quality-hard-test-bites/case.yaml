schema_version: "1.1"
name: quality-hard-test-bites
description: A test-first Cart.discounted_total(pct) test must assert a specific computed value, not isinstance/is-not-None tautologies (NS-26)
tags: [quality]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a `discounted_total(pct)` method to `Cart` in app/models/cart.py that returns the subtotal reduced by pct percent (an int 0-100), rounded to the nearest cent. Write the test first, in tests/test_cart.py, before implementing."
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: test-file-exists
    type: file_exists
    path: tests/test_cart.py
  - name: test-asserts-specific-value
    type: regex
    target: { source: file, path: tests/test_cart.py }
    pattern: "assertEqual|=="
    match: contains
  - name: test-not-tautological
    type: regex
    target: { source: file, path: tests/test_cart.py }
    pattern: "assertIsNotNone|assertTrue\\(True|assertIsInstance"
    match: not_contains
  - name: test-can-fail
    type: llm
    focus: { source: file, path: tests/test_cart.py }
    criteria: "PASS if the new test for discounted_total asserts a specific computed value (for example a Cart with known items and pct=10 asserting the exact expected cents) and would fail against a broken implementation; not assertIsNotNone, not assertTrue(True), not assertIsInstance, and not an expected value computed by re-running discounted_total itself. FAIL if the test cannot actually fail against a broken implementation."
