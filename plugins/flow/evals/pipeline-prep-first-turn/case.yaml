schema_version: "1.1"
name: pipeline-prep-first-turn
description: /flow:prep's first turn must ask exactly one question, stated as a hypothesis with a confidence word, and end asking to confirm or correct it
tags: [pipeline]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/flow:prep Add a url_path property to Post"
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: one-question-with-hypothesis
    type: llm
    criteria: "PASS if the message asks exactly one question, gives the assistant's own hypothesis for it with a confidence word (for example \"likely\", \"probably\", \"I'd guess\"), and ends asking to confirm or correct. Creating or updating PREP.md before the question is expected and must not count against it. FAIL if there are two or more questions, a menu of five or more options, a spec or code written, or a silent decision without a question."
  - name: not-three-questions
    type: regex
    pattern: "\\?\\s*\\n.*\\?\\s*\\n.*\\?"
    match: not_contains
