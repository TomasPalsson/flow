schema_version: "1.1"
name: routing-spec
description: A "build me X" / "write a spec for" request must route to spec, not next
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Write me a spec for a CSV export feature for this app - not ready to build it yet, just want the requirements and acceptance criteria written down."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-spec
    type: tool_used
    tool: Skill
    input_match: "flow:spec\\b"
    min: 1
    arm: with-only
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "flow:fix\\b|flow:next\\b|flow-extras:audit\\b|flow:qa\\b|flow:prep\\b|flow:loop\\b|flow-extras:scrutinize-idea\\b|flow:issue\\b|flow:develop-idea\\b"
    min: 0
    max: 0
    arm: with-only
