schema_version: "1.1"
name: routing-flow-spec
description: A request for a spec document without an intent to build yet must route to flow-spec, not flow
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Write me a spec for a CSV export feature for this app - not ready to build it yet, just want the requirements and acceptance criteria written down."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-flow-spec
    type: tool_used
    tool: Skill
    input_match: "flow:flow-spec\\b"
    min: 1
    arm: with-only
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "flow:feature\\b|flow:fix\\b|flow:flow\\b(?!-)|flow:audit\\b|flow:qa\\b|flow:prep\\b|flow:loop\\b|flow:scrutinize-idea\\b"
    min: 0
    max: 0
    arm: with-only
