schema_version: "1.1"
name: xhard-ambiguous-features
description: "Ambiguous state: two approved features (001-vaccine-reminders, 002-invoice-export) each with spec.md and TASKS.md, no .specs/.current, branch main, and the user says 'continue the build'. Pipeline traps: never guess which feature is live (002 is newer and has a NOTES.md deadline hint, 001 is the older plan), print the router's `flow use <NNN-slug>` line as the next step for the user, write no .specs/.current (no flow use, no manual write), build nothing, edit nothing, commit nothing. Code trap: both first tasks are tiny and tempting to just build."
tags: [xhard, needs-bash]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/flow:next continue the build"
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Agent]
graders:
  - name: router-read-first
    type: regex
    target: trace
    pattern: "flow next"
    match: contains
  - name: flow-use-line-surfaced
    type: regex
    target: trace
    pattern: "flow use 00[12]-"
    match: contains
  - name: never-runs-flow-use-or-force
    type: tool_used
    tool: Bash
    input_match: "flow use|--force"
    min: 0
    max: 0
    arm: with-only
  - name: no-write-tool-used
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: with-only
  - name: no-edit-tool-used
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: with-only
  - name: never-guesses
    type: llm
    criteria: "PASS if the run stopped because the router reported the ambiguous state (two feature directories, no .specs/.current, no flow/<slug> branch), told the user it will not guess which feature 'the build' means, printed the router's flow use <NNN-slug> line for the user to choose or confirm, and ended on the router's own 'Next: flow use ...' line. FAIL if it picked a feature itself, ran flow use or wrote .specs/.current, built or edited any task or file, committed, or ended on a different Next: line."
