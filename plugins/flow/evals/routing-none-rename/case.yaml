schema_version: "1.1"
name: routing-none-rename
description: A trivial single-variable rename must not fire any skill
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Rename the local variable `x` to `count` inside the `tally` function in src/counter.py. That's the only change needed."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-skill-fires
    type: tool_used
    tool: Skill
    input_match: "flow:"
    min: 0
    max: 0
