schema_version: "1.1"
name: quality-test-can-fail
description: A new test must be able to fail against a broken implementation, not a tautology (NS-26)
tags: [quality]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Write a pytest test for `add` in src/calc.py, placed in tests/test_calc.py, covering at least one case with two distinct non-zero inputs whose sum differs from either input."
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: test-can-actually-fail
    type: llm
    focus: { source: file, path: tests/test_calc.py }
    criteria: "PASS if the new test asserts a specific computed value (for example add(2, 3) == 5) and would fail if add were broken; not `assert True`, not only `assertIsNotNone`, not an assertion whose expected value is computed by re-running add() itself, and not a snapshot as the only check. FAIL if the test cannot actually fail against a broken implementation."
