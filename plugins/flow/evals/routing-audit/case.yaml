schema_version: "1.1"
name: routing-audit
description: A whole-codebase tech-debt sweep request must route to the audit skill
tags: [routing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Audit this whole codebase for tech debt - I want a health check across everything, not just one file, so we can plan a modernization pass."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-audit
    type: tool_used
    tool: Skill
    input_match: "flow-extras:audit\\b"
    min: 1
    arm: with-only
  - name: no-other-hub-skill
    type: tool_used
    tool: Skill
    input_match: "flow:fix\\b|flow:next\\b|flow:spec\\b|flow:qa\\b|flow:prep\\b|flow:loop\\b|flow-extras:scrutinize-idea\\b|flow:issue\\b|flow:develop-idea\\b"
    min: 0
    max: 0
    arm: with-only
